# Reload conf
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -sg escape-time 0
set -g mouse on

# Split
bind v split-window -h
bind h split-window -v

# popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind f display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "\
  fzf --style=full:rounded --height=100% --margin=1,2  \
    --color=bg:0,fg:8,border:5,header:5 \
    --color=hl:2,hl+:5,fg+:0,bg+:3 \
    --color=pointer:5,marker:5,prompt:6,info:8,gutter:0 \
    --color=list-border:8,input-border:5,preview-border:8 \
    --preview 'bat --color=always --style=numbers --line-range=:500 {}' \
  | pbcopy"


# IME off on pane focus
set-hook -g after-select-pane "run-shell 'imeoff'"

# Pane move (Option+jk, cycle all panes by index)
bind-key -nr M-j select-pane -t :.+
bind-key -nr M-k select-pane -t :.-


# Status bar (zellij-like navigation hints)
set -g status on
set -g status-justify centre
set -g status-bg "#0D0D1A"
set -g status-fg "#E8FF00"

set -g status-left-length 60
set -g status-right-length 80

# Session / window / pane info
set -g status-left "#[bold]S:#S #[default] | P:#P"
# Navigation hints
set -g status-right "Move: <Opt> jk | Split: <C-b> v/h | Scroll: <C-b> [ | Quit: <C-b> d"

# Window list style
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold]#[fg=#0D0D1A]#[bg=#E8FF00] #I:#W #[default]"


# Pane border highlight (neon colors)
set -g pane-border-style fg="#FF10F0"
set -g pane-active-border-style fg="#FF10F0"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bold]#[fg=#0D0D1A]#[bg=#E8FF00] ACTIVE #[default],#[fg=colour244]#{pane_title}#[default]}"

# Auto-split layout for claude-* sessions
# Layout: top 2 (left=claude, right=shell), bottom 1 (shell)
# Focus: claude pane (top-left)
set-hook -g after-new-session \
  'if-shell "tmux display -p \"#{session_name}\" | grep -q \"^claude-\"" \
    "split-window -v -p 30 ; \
     select-pane -t 0 ; \
     split-window -h -p 50 ; \
     send-keys -t 0 \"claude\" C-m ; \
     select-pane -t 0"'

# Share clipboard with OS using OSC52
set-option -s set-clipboard on

# Plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
