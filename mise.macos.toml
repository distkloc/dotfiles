# macOS. mise itself is installed by bootstrap/install.sh (brew install mise).

[bootstrap.packages]
"brew:awscli" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:go" = "latest"
"brew:jq" = "latest"
"brew:lazygit" = "latest"
"brew:neovim" = "latest"
"brew:peco" = "latest"
"brew:sheldon" = "latest"
"brew:tmux" = "latest"
"brew:yazi" = "latest"
"brew:trasta298/tap/keifu" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:appcleaner" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:font-hackgen" = "latest" # https://github.com/yuru7/HackGen
"brew-cask:font-hackgen-nerd" = "latest"

# macOS preferences, written as `defaults write` does. Restart Dock / Finder / SystemUIServer (or log out) to see changes.

[bootstrap.macos.dock]
autohide = true
magnification = true
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

# Values stored as reals by System Settings stay floats so status reports them as set
[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 48.0
largesize = 83.0
showAppExposeGestureEnabled = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleActionOnDoubleClick = "None" # Double-click a title bar: do nothing
AppleInterfaceStyle = "Dark"
AppleIconAppearanceTheme = "ClearAutomatic" # Icon & widget style: Clear, automatic
AppleShowAllExtensions = true
KeyRepeat = 2.0
InitialKeyRepeat = 15.0
"com.apple.trackpad.scaling" = 3.0

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0 # Globe key: do nothing

# Three-finger drag takes the three-finger swipes, so App Exposé moves to four fingers down
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadThreeFingerHorizSwipeGesture = 0
TrackpadThreeFingerVertSwipeGesture = 0
TrackpadFourFingerHorizSwipeGesture = 2
TrackpadFourFingerVertSwipeGesture = 2

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadThreeFingerHorizSwipeGesture = 0
TrackpadThreeFingerVertSwipeGesture = 0
TrackpadFourFingerHorizSwipeGesture = 2
TrackpadFourFingerVertSwipeGesture = 2

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

# Keyboard shortcuts (System Settings > Keyboard > Keyboard Shortcuts)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["36", "enabled"] # Show Desktop
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"] # Show Spotlight search
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"] # Select the previous input source: Cmd+Space
value = { enabled = true, value = { parameters = [32, 49, 1048576], type = "standard" } }

# Move Minimize to Cmd+Opt+Shift+M so Cmd+M stops minimizing (https://mono96.jp/apple/mac/38974/)
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["Minimize"]
value = "@~$m"

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["しまう"]
value = "@~$m"

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["最小化"]
value = "@~$m"

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["\u001bウインドウ\u001bしまう"]
value = "@~$m"

# Menu bar (8 hides the item)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Bluetooth"
host = "current"
value = 2 # Show

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Sound"
host = "current"
value = 18 # Always show

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Spotlight"
key = "MenuItemHidden"
host = "current"
value = true
